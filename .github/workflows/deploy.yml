name: Deploy 3D Product projects to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChronoCore/package-lock.json
      - name: Build every project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp site/index.html dist/index.html
          for project in */; do
            if [ -f "${project}package.json" ]; then
              name="${project%/}"
              echo "Building ${name}"
              npm ci --prefix "${project}"
              npm test --prefix "${project}"
              npm run build --prefix "${project}" -- --outDir "${GITHUB_WORKSPACE}/dist/${name}"
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4