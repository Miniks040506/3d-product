<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111311" />
    <title>3D Product — Interactive experiences</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #111311; color: #eceee8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 72% 20%, #32382a 0, transparent 36%), #111311; }
      main { max-width: 1100px; margin: auto; padding: 10vh 7vw; }
      .eyebrow { color: #d6ac86; font-size: 11px; letter-spacing: .2em; }
      h1 { max-width: 780px; font-size: clamp(48px, 9vw, 112px); font-weight: 400; letter-spacing: -.06em; line-height: .95; margin: 24px 0 54px; }
      h1 span { color: #a8b09a; }
      .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      a { color: inherit; text-decoration: none; }
      .project { min-height: 220px; padding: 28px; border: 1px solid #ffffff1d; background: #181b17d9; transition: transform .25s, border-color .25s; }
      .project:hover { transform: translateY(-5px); border-color: #d6ac86; }
      .project h2 { margin: 50px 0 10px; font-size: 28px; font-weight: 400; }
      .project p { color: #9aa08f; font-size: 13px; line-height: 1.7; }
      footer { margin-top: 80px; padding-top: 20px; border-top: 1px solid #ffffff1d; color: #737d69; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">3D PRODUCT / COLLECTION 01</div>
      <h1>Objects with a point of view.<br /><span>Built to be explored.</span></h1>
      <section class="projects" aria-label="Projects">
        <a class="project" href="./ChronoCore/">
          <div class="eyebrow">01 / MECHANICAL STUDY</div>
          <h2>ChronoCore ↗</h2>
          <p>A procedural skeleton watch. Rotate, zoom, and separate the movement layer by layer.</p>
        </a>
      </section>
      <footer>More interactive product studies will join the collection.</footer>
    </main>
  </body>
</html>
